<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Copilot Review Demo</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      font-family: Arial, sans-serif;
    }

    .card {
      margin: 12px 0;
      padding: 16px;
      border: 1px solid #cccccc;
      border-radius: 8px;
    }

    .highlight {
      background-color: #fff3a3;
    }
  </style>
</head>

<body>
  <h1>Copilot Review Demo</h1>

  <p>This page contains two cards.</p>

  <div class="card">First card</div>
  <div class="card">Second card</div>
  <script>
  document.querySelectorAll(".card").forEach((card) => {
    card.classes.add("highlight");
  });
</script>
</body>
</html>
